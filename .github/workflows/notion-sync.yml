# 노션 → 사이트 자동 발행
# 10분마다 노션 '전시 게시물'의 발행·재발행·내림 요청을 확인해 content/에 반영하고 저장소에 올린다.
# 올라가면 Cloudflare Pages가 사이트를 다시 만든다. 그 뒤 노션에 '발행됨'·'내려감'을 적는다.
# 급할 때: 저장소 → Actions → Notion sync → Run workflow
name: Notion sync

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '실패했던 요청도 다시 시도'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_SETTINGS_DS: ${{ vars.NOTION_SETTINGS_DS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 노션 요청 반영
        run: node scripts/sync.js ${{ inputs.force && '--force' || '' }}

      - name: 바뀐 내용 올리기 (Cloudflare가 사이트를 다시 만든다)
        run: |
          git config user.name "plot-twist-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain content)" ]; then
            git add content
            git commit -m "노션 동기화"
            git push
          else
            echo "바뀐 내용 없음"
          fi

      - name: 노션에 결과 적기
        run: node scripts/sync.js --flush

      - name: 기록 상태 저장 (사이트는 다시 만들지 않음)
        run: |
          if [ -n "$(git status --porcelain content)" ]; then
            git add content
            git commit -m "노션 기록 완료 [CF-Pages-Skip]"
            git push
          fi

      # 공개 저장소는 60일 동안 변화가 없으면 예약 실행이 멈춰서, 45일마다 빈 기록을 남긴다.
      - name: 예약 실행 유지
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 24 * 3600 )) ]; then
            git commit --allow-empty -m "예약 실행 유지 [CF-Pages-Skip]"
            git push
          fi
